## This file defines Boxer's 'baseline' DOSBox settings, which are
## loaded before any other settings are considered.
## Note that the list below has been stripped of settings that
## Boxer no longer uses, which includes all of the [sdl] section.


[dosbox]

machine=svga_s3
memsize=16


[render]



[cpu]

core=auto
cputype=auto

## These two reproduce what the old 'cycles=auto' did: a fixed, period-correct
## speed for real-mode programs, and as much speed as the host can give to
## protected-mode ones. 0.83 deprecated 'cycles' and splits the two, and its own
## default for protected mode is a fixed 60000 rather than 'max' -- we keep 'max'
## here so behaviour matches the pre-0.83 build. Boxer's CPU Inspector sets both
## at once. See FINDINGS.md, D39.
cpu_cycles=3000
cpu_cycles_protected=max


[mixer]

nosound=false
rate=44100
blocksize=1024
prebuffer=100


[midi]

mididevice=auto
mpu401=intelligent
midiconfig=0


[sblaster]

sbtype=sb16
sbbase=220
irq=7 
dma=1 
hdma=5
sbmixer=true		
oplmode=auto


[gus]

gus=true
gusbase=240
gusirq=5
gusdma=3

## Set automatically by Boxer, but still overridable
ultradir=Y:\ULTRASND


[speaker]

pcspeaker=impulse
tandy=auto
## No parallel-port DAC, to prevent conflicts with printer emulation.
## Setting this to disney, covox or ston1 will disable the printer.
## (This was disney=false until 0.83 deprecated it in favour of lpt_dac.)
lpt_dac=none


[joystick]

joysticktype=auto
timed=false
## The other joystick settings (autofire, axis swapping) are ignored by Boxer


[serial]

serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[parallel]

parallel1=printer
parallel2=disabled
parallel3=disabled

[dos]

xms=true
ems=true
umb=true

## Set automatically by Boxer, but still overridable
keyboard_layout=auto

[ipx]

## IPX is off by default. The comment that used to sit here said Boxer enabled it
## "as needed by the Boxer DOS commands NETWORK, HOST and JOIN"; no such commands
## exist -- that text predates the 0.83 migration. IPX does work if you turn it
## on here: dosbox.cpp calls IPX_Init(), and IPXNET is available at the DOS
## prompt. The same goes for serial1=modem or nullmodem above.
ipx=false

[autoexec]

@echo off
boxer_preflight
